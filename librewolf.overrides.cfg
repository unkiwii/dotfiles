const homepage = "file:///usr/share/homepage/homepage.html";

try {
  const ctx = {};
  ChromeUtils.defineESModuleGetters(ctx, {
    AboutNewTab: "resource:///modules/AboutNewTab.sys.mjs"
  });
  ctx.AboutNewTab.newTabURL = homepage;
} catch (e) {
  ChromeUtils.reportError(e);
}

lockPref("browser.startup.homepage", homepage);
lockPref("services.sync.prefs.sync.browser.startup.homepage", false);
lockPref("browser.newtabpage.activity-stream.aboutHome.enabled", false);
